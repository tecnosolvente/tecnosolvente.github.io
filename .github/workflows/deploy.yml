# Publica la landing en GitHub Pages en cada push a main.
# Requiere una sola vez: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Si hay dos deploys seguidos, se cancela el viejo y queda el último.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
      - name: Compilar con Astro y preparar el sitio
        uses: withastro/action@v3
        with:
          node-version: 20

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
